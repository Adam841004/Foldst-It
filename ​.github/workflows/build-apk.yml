name: Build FoldstIt APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 2. Java 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Gradle 8.2 강제 세팅
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.2'

      - name: 4. 아이콘 적용 (업로드된 ic_foldstit.png 배포)
        run: |
          if [ -f "ic_foldstit.png" ]; then
            for folder in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p "app/src/main/res/$folder"
              cp ic_foldstit.png "app/src/main/res/$folder/ic_launcher.png"
              cp ic_foldstit.png "app/src/main/res/$folder/ic_launcher_round.png"
              cp ic_foldstit.png "app/src/main/res/$folder/ic_launcher_foreground.png"
            done
          fi

      - name: 5. FoldstIt APK 빌드
        run: |
          gradle assembleDebug --stacktrace

      - name: 6. 완성된 FoldstIt APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: FoldstIt-APK
          path: app/build/outputs/apk/debug/app-debug.apk
